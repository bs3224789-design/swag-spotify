<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #fff;
            padding: 0 20px 100px 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 10;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            font-family: 'Impact', sans-serif;
        }
        .logo span { color: #cc0000; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .login-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
        }
        .login-btn:hover { background: rgba(255,255,255,0.15); }
        .login-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .login-btn.green { background: #1db954; color: #000; }
        .login-btn.green:hover { background: #1ed760; }
        .status-text {
            font-size: 13px;
            color: #666;
            font-weight: 400;
        }
        .status-text.success { color: #1db954; }
        .status-text.error { color: #cc0000; }

        .search-section {
            margin: 24px 0 20px 0;
            display: flex;
            gap: 10px;
        }
        .search-section input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }
        .search-section input::placeholder { color: #666; }
        .search-section input:focus { background: rgba(255,255,255,0.1); }
        .search-section button {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            white-space: nowrap;
        }
        .search-section button:hover { background: rgba(255,255,255,0.12); }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 28px 0 16px 0;
            color: #fff;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .result-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 16px 16px 12px 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            border: none;
        }
        .result-card:hover { background: rgba(255,255,255,0.07); }
        .result-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 6px;
            background: #1a1a1a;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }
        .result-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .result-card .cover .empty-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 48px;
            color: #333;
        }
        .result-card .cover .play-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #000;
            opacity: 0;
            transform: translateY(8px);
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .result-card:hover .cover .play-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        .result-card .title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-card .artist {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        #nowPlaying {
            display: none;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            margin: 20px 0 12px 0;
            text-align: left;
        }
        #nowPlaying .np-cover {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: #1a1a1a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        #nowPlaying .np-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #nowPlaying .np-info { flex: 1; overflow: hidden; }
        #nowPlaying .np-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #nowPlaying .np-artist {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 8px 0;
        }
        .player-controls button {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .player-controls button:hover { color: #fff; }
        .player-controls .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            color: #000;
            font-size: 20px;
        }
        .player-controls .play-btn:hover { background: #1ed760; }
        .player-controls .play-btn.paused {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .player-controls .play-btn.paused:hover { background: rgba(255,255,255,0.15); }

        .player-wrapper {
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0,0,0,0.5);
            display: none;
            margin-top: 8px;
        }
        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 80px;
            border: none;
        }

        .loading {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
            font-size: 14px;
            text-align: center;
        }
        .no-results {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
            font-size: 14px;
            text-align: center;
        }
        .empty-state {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px 0;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .header-right { width: 100%; justify-content: space-between; }
            .logo { font-size: 22px; }
            .results { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .search-section { flex-wrap: wrap; }
            .search-section input { min-width: 100px; }
            .search-section button { padding: 14px 16px; font-size: 13px; }
        }
        @media (max-width: 400px) {
            .results { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo"><span>SWAG</span></div>
        <div class="header-right">
            <span class="status-text" id="status">Войди в Spotify</span>
            <button class="login-btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <!-- ===== ПОИСК ===== -->
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Что будем слушать?" value="The Weeknd Starboy">
        <button id="searchBtn">Найти</button>
    </div>

    <!-- ===== СЕЙЧАС ИГРАЕТ ===== -->
    <div id="nowPlaying">
        <div class="np-cover" id="npCover">🎵</div>
        <div class="np-info">
            <div class="np-title" id="npTitle">Выбери трек</div>
            <div class="np-artist" id="npArtist">—</div>
        </div>
    </div>

    <!-- ===== КОНТРОЛЫ ===== -->
    <div id="playerControls" style="display:none;">
        <div class="player-controls">
            <button id="prevBtn">⏮</button>
            <button class="play-btn" id="playBtn">▶</button>
            <button id="nextBtn">⏭</button>
        </div>
    </div>

    <!-- ===== РЕЗУЛЬТАТЫ ===== -->
    <div class="section-title">Популярное</div>
    <div id="resultsContainer">
        <div class="empty-state">Войди в Spotify и ищи музыку</div>
    </div>

    <!-- ===== ПЛЕЕР ===== -->
    <div class="player-wrapper" id="playerWrapper">
        <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        // =============================================
        // ВСЯ ЛОГИКА В ОДНОМ МЕСТЕ
        // =============================================
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');
        const nowPlaying = document.getElementById('nowPlaying');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npArtist = document.getElementById('npArtist');
        const playerControls = document.getElementById('playerControls');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let accessToken = null;
        let playlist = [];
        let currentIndex = -1;
        let isPlaying = false;

        // =============================================
        // 1. ПРОВЕРКА ТОКЕНА
        // =============================================
        function getTokenFromUrl() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }

        const tokenFromUrl = getTokenFromUrl();
        if (tokenFromUrl) {
            accessToken = tokenFromUrl;
            localStorage.setItem('spotify_token', accessToken);
            window.history.replaceState({}, document.title, window.location.pathname);
            updateStatus('✅ Авторизован', 'success');
            loadUserPlaylists();
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                accessToken = savedToken;
                updateStatus('✅ Авторизован', 'success');
                loadUserPlaylists();
            }
        }

        // =============================================
        // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // =============================================
        function updateStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status-text';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
            if (text.includes('Авторизован')) {
                loginBtn.disabled = true;
                loginBtn.textContent = '✅ Вход';
                loginBtn.classList.add('green');
            } else {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
                loginBtn.classList.remove('green');
            }
        }

        function renderTracks(tracks) {
            if (!tracks || tracks.length === 0) {
                resultsContainer.innerHTML = `<div class="empty-state">😢 Нет треков</div>`;
                return;
            }

            let html = '<div class="results">';
            tracks.slice(0, 12).forEach((track, index) => {
                const cover = track.album?.images?.[0]?.url || '';
                const coverHtml = cover ? `<img src="${cover}">` : '<div class="empty-cover">🎵</div>';
                html += `
                    <div class="result-card" onclick="playTrack(${index})" data-index="${index}">
                        <div class="cover">
                            ${coverHtml}
                            <div class="play-overlay">▶</div>
                        </div>
                        <div class="title">${track.name}</div>
                        <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                    </div>
                `;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // =============================================
        // 3. ЗАГРУЗКА ПЛЕЙЛИСТОВ
        // =============================================
        async function loadUserPlaylists() {
            if (!accessToken) return;

            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.error) {
                    if (data.error.status === 401) {
                        updateStatus('❌ Токен протух', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Войти';
                        loginBtn.classList.remove('green');
                        return;
                    }
                    updateStatus('❌ Ошибка', 'error');
                    return;
                }

                if (data.items && data.items.length > 0) {
                    const firstPlaylist = data.items[0];
                    const tracksRes = await fetch(`https://api.spotify.com/v1/playlists/${firstPlaylist.id}/tracks`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const tracksData = await tracksRes.json();
                    const tracks = tracksData.items.map(item => item.track).filter(t => t);
                    playlist = tracks;
                    renderTracks(tracks);
                    updateStatus(`✅ ${tracks.length} треков`, 'success');
                } else {
                    updateStatus('ℹ️ Нет плейлистов', '');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                updateStatus('❌ Ошибка', 'error');
            }
        }

        // =============================================
        // 4. ПОИСК
        // =============================================
        async function searchMusic() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = `<div class="empty-state">Напиши название</div>`;
                return;
            }

            if (!accessToken) {
                resultsContainer.innerHTML = `<div class="empty-state">Сначала войди в Spotify</div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="loading">⏳ Ищем...</div>`;

            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=12`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.error) {
                    if (data.error.status === 401) {
                        updateStatus('❌ Токен протух', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Войти';
                        loginBtn.classList.remove('green');
                        resultsContainer.innerHTML = `<div class="empty-state">Войди заново</div>`;
                        return;
                    }
                    resultsContainer.innerHTML = `<div class="empty-state">❌ ${data.error.message}</div>`;
                    return;
                }

                if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                    playlist = data.tracks.items;
                    renderTracks(playlist);
                } else {
                    resultsContainer.innerHTML = `<div class="empty-state">😢 Ничего не найдено</div>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultsContainer.innerHTML = `<div class="empty-state">❌ Ошибка поиска</div>`;
            }
        }

        // =============================================
        // 5. ПЛЕЕР
        // =============================================
        function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];
            if (!track) return;

            isPlaying = true;

            const cover = track.album?.images?.[0]?.url || '';
            npCover.innerHTML = cover ? `<img src="${cover}">` : '🎵';
            npTitle.textContent = track.name;
            npArtist.textContent = track.artists.map(a => a.name).join(', ');
            nowPlaying.style.display = 'flex';
            playerControls.style.display = 'block';

            playerFrame.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0&autoplay=1`;
            playerWrapper.style.display = 'block';
            playBtn.textContent = '⏸';
            playBtn.classList.remove('paused');

            document.querySelectorAll('.result-card').forEach((el, i) => {
                el.style.background = i === index ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
            });

            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // =============================================
        // 6. ОБРАБОТЧИКИ
        // =============================================
        loginBtn.addEventListener('click', function() {
            if (this.disabled) return;
            const CLIENT_ID = '6947d62243054b51b3de71aac3356264';
            const REDIRECT_URI = 'https://swag-spotify.onrender.com/callback';
            const scopes = 'user-read-private user-read-email streaming user-modify-playback-state user-read-playback-state playlist-read-private';
            window.location.href = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scopes)}`;
        });

        searchBtn.addEventListener('click', searchMusic);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchMusic();
        });

        prevBtn.addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex < 0) return;
            const newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(newIndex);
        });

        nextBtn.addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex < 0) return;
            const newIndex = (currentIndex + 1) % playlist.length;
            playTrack(newIndex);
        });

        playBtn.addEventListener('click', function() {
            if (playlist.length === 0 || currentIndex < 0) {
                if (playlist.length > 0) {
                    playTrack(0);
                }
                return;
            }

            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸' : '▶';
            this.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                const track = playlist[currentIndex];
                playerFrame.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0&autoplay=1`;
            } else {
                const track = playlist[currentIndex];
                playerFrame.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0&autoplay=0`;
            }
        });

        // =============================================
        // 7. АВТОМАТИЧЕСКИЙ ПОИСК ПРИ ЗАГРУЗКЕ
        // =============================================
        setTimeout(() => {
            if (accessToken) {
                searchMusic();
            }
        }, 1000);

        console.log('🩸 SWAG загружен!');
        console.log('🔑 Токен:', accessToken ? 'ЕСТЬ ✅' : 'НЕТ ❌');
        console.log('📀 Плейлистов:', playlist.length);
    </script>

</body>
</html>
