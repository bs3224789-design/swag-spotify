<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 16px;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #0a0000 0%, #050000 70%);
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .blood-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #cc0000;
            text-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            font-family: 'Impact', sans-serif;
            margin-bottom: 4px;
        }

        .blood-sub {
            font-size: 13px;
            color: #883333;
            letter-spacing: 6px;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 20px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .login-btn {
            background: rgba(29, 185, 84, 0.15);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 60px;
            padding: 14px 32px;
            color: #1db954;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            width: 100%;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: rgba(29, 185, 84, 0.25);
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.1);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 13px;
            color: #883333;
            font-family: 'Segoe UI', sans-serif;
            padding: 6px 0 0 0;
        }

        .status.success {
            color: #1db954;
        }
        .status.error {
            color: #cc0000;
        }

        .search-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-section input {
            flex: 1;
            min-width: 160px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 12px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }

        .search-section input::placeholder {
            color: #663333;
        }

        .search-section input:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-section button {
            background: rgba(200, 0, 0, 0.15);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(200, 0, 0, 0.25);
            border-radius: 60px;
            padding: 12px 20px;
            color: #cc6666;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        .search-section button:hover {
            background: rgba(200, 0, 0, 0.25);
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.1);
        }

        /* ===== СЕЙЧАС ИГРАЕТ ===== */
        #nowPlaying {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        #nowPlaying .np-cover {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: #1a0a0a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #nowPlaying .np-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #nowPlaying .np-info {
            flex: 1;
            overflow: hidden;
        }

        #nowPlaying .np-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #nowPlaying .np-artist {
            font-size: 14px;
            color: #883333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== КОНТРОЛЫ ПЛЕЕРА ===== */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .player-controls button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: #cc6666;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .player-controls button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .player-controls .play-btn {
            width: 56px;
            height: 56px;
            font-size: 24px;
            background: rgba(200, 0, 0, 0.2);
            border-color: rgba(200, 0, 0, 0.3);
            color: #cc0000;
        }

        .player-controls .play-btn:hover {
            background: rgba(200, 0, 0, 0.35);
            border-color: rgba(200, 0, 0, 0.5);
        }

        /* ===== ГРОМКОСТЬ ===== */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .volume-section .vol-icon {
            font-size: 18px;
            color: #663333;
        }

        .volume-section input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: 0.3s;
        }

        .volume-section input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #cc0000;
            cursor: pointer;
            border: none;
        }

        .volume-section input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #cc0000;
            cursor: pointer;
            border: none;
        }

        .volume-section .vol-value {
            font-size: 13px;
            color: #663333;
            min-width: 36px;
            text-align: right;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ===== ЭКВАЛАЙЗЕР (визуализация) ===== */
        .equalizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 36px;
            margin-top: 10px;
        }

        .equalizer .bar {
            width: 6px;
            height: 8px;
            background: rgba(200, 0, 0, 0.4);
            border-radius: 3px;
            transition: height 0.2s ease;
        }

        .equalizer .bar.active {
            background: linear-gradient(180deg, #cc0000, #ff4444);
            box-shadow: 0 0 12px rgba(200, 0, 0, 0.3);
        }

        /* ===== РЕЗУЛЬТАТЫ ===== */
        .results {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .result-card .cover {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #1a0a0a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .result-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-card .info {
            flex: 1;
            overflow: hidden;
        }

        .result-card .title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-card .artist {
            font-size: 12px;
            color: #883333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== ПЛЕЕР ===== */
        .player-wrapper {
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 80px;
            border: none;
        }

        .loading {
            color: #663333;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px 0;
            font-size: 14px;
        }

        .no-results {
            color: #663333;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px 0;
            font-size: 14px;
        }

        .empty-state {
            color: #553333;
            font-family: 'Segoe UI', sans-serif;
            padding: 12px 0;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .blood-title { font-size: 40px; letter-spacing: 4px; }
            .glass { padding: 14px 16px; }
            .search-section input { min-width: 120px; font-size: 13px; }
            .search-section button { font-size: 13px; padding: 10px 16px; }
            .result-card .cover { width: 40px; height: 40px; font-size: 18px; }
            .result-card .title { font-size: 13px; }
            .result-card .artist { font-size: 11px; }
            #nowPlaying .np-cover { width: 52px; height: 52px; font-size: 22px; }
            #nowPlaying .np-title { font-size: 15px; }
            #nowPlaying .np-artist { font-size: 12px; }
            .player-controls button { width: 38px; height: 38px; font-size: 16px; }
            .player-controls .play-btn { width: 48px; height: 48px; font-size: 20px; }
            .equalizer { height: 28px; }
            .equalizer .bar { width: 4px; }
            .player-wrapper iframe { height: 60px; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="app">

        <div class="blood-title">SWAG</div>
        <div class="blood-sub">• только для своих</div>

        <div class="glass">
            <button class="login-btn" id="loginBtn">🔑 Войти через Spotify</button>
            <div class="status" id="status">Нажми на кнопку выше</div>
        </div>

        <div class="glass">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Поиск треков..." value="The Weeknd Starboy">
                <button id="searchBtn">Искать</button>
            </div>
        </div>

        <!-- СЕЙЧАС ИГРАЕТ -->
        <div class="glass" id="nowPlaying">
            <div class="np-cover" id="npCover">🎵</div>
            <div class="np-info">
                <div class="np-title" id="npTitle">Выбери трек</div>
                <div class="np-artist" id="npArtist">—</div>
            </div>
        </div>

        <!-- КОНТРОЛЫ + ЭКВАЛАЙЗЕР -->
        <div class="glass" id="playerControls" style="display:none;">
            <div class="player-controls">
                <button id="prevBtn" title="Предыдущий">⏮</button>
                <button class="play-btn" id="playBtn" title="Play/Pause">▶</button>
                <button id="nextBtn" title="Следующий">⏭</button>
            </div>

            <!-- ЭКВАЛАЙЗЕР -->
            <div class="equalizer" id="equalizer">
                <div class="bar" id="bar0"></div>
                <div class="bar" id="bar1"></div>
                <div class="bar" id="bar2"></div>
                <div class="bar" id="bar3"></div>
                <div class="bar" id="bar4"></div>
                <div class="bar" id="bar5"></div>
                <div class="bar" id="bar6"></div>
                <div class="bar" id="bar7"></div>
                <div class="bar" id="bar8"></div>
                <div class="bar" id="bar9"></div>
                <div class="bar" id="bar10"></div>
                <div class="bar" id="bar11"></div>
                <div class="bar" id="bar12"></div>
                <div class="bar" id="bar13"></div>
                <div class="bar" id="bar14"></div>
                <div class="bar" id="bar15"></div>
            </div>

            <!-- ГРОМКОСТЬ -->
            <div class="volume-section">
                <span class="vol-icon">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="80">
                <span class="vol-value" id="volumeValue">80%</span>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div id="resultsContainer">
            <div class="glass">
                <div class="empty-state">Войди в Spotify и ищи музыку</div>
            </div>
        </div>

        <!-- ПЛЕЕР -->
        <div class="player-wrapper" id="playerWrapper">
            <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

    </div>

    <script>
        // =============================================
        // 1. ЗВЁЗДЫ
        // =============================================
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.2 + 0.03,
                brightness: Math.random() * 0.7 + 0.3,
                phase: Math.random() * Math.PI * 2
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height, 0, canvas.width/2, canvas.height, canvas.width*0.8);
            gradient.addColorStop(0, '#120000');
            gradient.addColorStop(1, '#050000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() / 1000;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
                const flicker = Math.sin(time * (1 + star.speed * 5) + star.phase) * 0.3 + 0.7;
                const alpha = star.brightness * flicker;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 200, ${alpha * 0.6})`;
                if (star.radius > 1.5) {
                    ctx.shadowColor = 'rgba(255,100,100,0.15)';
                    ctx.shadowBlur = 12;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // =============================================
        // 2. SPOTIFY
        // =============================================
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');
        const nowPlaying = document.getElementById('nowPlaying');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npArtist = document.getElementById('npArtist');
        const playerControls = document.getElementById('playerControls');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');

        let accessToken = null;
        let currentTrackId = null;
        let playlist = [];
        let currentIndex = -1;
        let isPlaying = false;

        // ===== ЭКВАЛАЙЗЕР =====
        const bars = document.querySelectorAll('.bar');
        let eqInterval = null;

        function startEqualizer() {
            if (eqInterval) return;
            eqInterval = setInterval(() => {
                bars.forEach(bar => {
                    const height = Math.random() * 30 + 6;
                    bar.style.height = height + 'px';
                    bar.classList.add('active');
                });
            }, 150);
        }

        function stopEqualizer() {
            if (eqInterval) {
                clearInterval(eqInterval);
                eqInterval = null;
            }
            bars.forEach(bar => {
                bar.style.height = '8px';
                bar.classList.remove('active');
            });
        }

        // ===== ТОКЕН =====
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('access_token');

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;
            localStorage.setItem('spotify_token', accessToken);
            window.history.replaceState({}, document.title, '/');
            showStatus('✅ Авторизован', 'success');
            loadUserPlaylists();
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                accessToken = savedToken;
                showStatus('✅ Авторизован', 'success');
                loadUserPlaylists();
            }
        }

        function showStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
            if (text.includes('Авторизован')) {
                loginBtn.disabled = true;
                loginBtn.textContent = '✅ Вход выполнен';
            }
        }

        loginBtn.addEventListener('click', function() {
            window.location.href = '/login';
        });

        // =============================================
        // 3. ЗАГРУЗКА ПЛЕЙЛИСТОВ
        // =============================================
        async function loadUserPlaylists() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.error) {
                    if (data.error.status === 401) {
                        showStatus('❌ Токен протух, войди заново', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🔑 Войти через Spotify';
                        return;
                    }
                    showStatus('❌ Ошибка загрузки', 'error');
                    return;
                }

                if (data.items && data.items.length > 0) {
                    const firstPlaylist = data.items[0];
                    const tracksRes = await fetch(`https://api.spotify.com/v1/playlists/${firstPlaylist.id}/tracks`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const tracksData = await tracksRes.json();
                    const tracks = tracksData.items.map(item => item.track).filter(t => t);
                    playlist = tracks;
                    renderTracks(tracks);
                    showStatus(`✅ Загружено ${tracks.length} треков`, 'success');
                } else {
                    showStatus('ℹ️ Нет плейлистов, используй поиск', '');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus('❌ Ошибка загрузки', 'error');
            }
        }

        // =============================================
        // 4. ОТРИСОВКА ТРЕКОВ
        // =============================================
        function renderTracks(tracks) {
            if (!tracks || tracks.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="glass">
                        <div class="empty-state">😢 Нет треков</div>
                    </div>
                `;
                return;
            }

            let html = '<div class="results">';
            tracks.slice(0, 10).forEach((track, index) => {
                const cover = track.album?.images?.[0]?.url || '';
                const coverHtml = cover ? `<img src="${cover}">` : '🎵';
                html += `
                    <div class="result-card" onclick="playTrack(${index})" data-index="${index}">
                        <div class="cover">${coverHtml}</div>
                        <div class="info">
                            <div class="title">${track.name}</div>
                            <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // =============================================
        // 5. ПОИСК
        // =============================================
        searchBtn.addEventListener('click', async function() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">Напиши название трека</div></div>`;
                return;
            }
            if (!accessToken) {
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">Сначала войди в Spotify</div></div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="glass"><div class="loading">⏳ Ищем...</div></div>`;

            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                    playlist = data.tracks.items;
                    renderTracks(playlist);
                } else {
                    resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">😢 Ничего не найдено</div></div>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">❌ Ошибка поиска</div></div>`;
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchBtn.click();
        });

        // =============================================
        // 6. ПЛЕЕР
        // =============================================
        function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];
            if (!track) return;

            currentTrackId = track.id;

            // Обновляем "Сейчас играет"
            const cover = track.album?.images?.[0]?.url || '';
            npCover.innerHTML = cover ? `<img src="${cover}">` : '🎵';
            npTitle.textContent = track.name;
            npArtist.textContent = track.artists.map(a => a.name).join(', ');
            nowPlaying.style.display = 'flex';
            playerControls.style.display = 'block';

            // Встраиваем плеер
            playerFrame.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0&autoplay=1`;
            playerWrapper.style.display = 'block';
            isPlaying = true;
            playBtn.textContent = '⏸';
            startEqualizer();

            // Подсветка активного трека
            document.querySelectorAll('.result-card').forEach((el, i) => {
                el.style.borderColor = i === index ? 'rgba(200,0,0,0.5)' : 'rgba(255,255,255,0.05)';
            });

            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ТРЕКОВ =====
        prevBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            const newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(newIndex);
        });

        nextBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            const newIndex = (currentIndex + 1) % playlist.length;
            playTrack(newIndex);
        });

        // ===== PLAY/PAUSE =====
        playBtn.addEventListener('click', function() {
            if (!currentTrackId) {
                if (playlist.length > 0) {
                    playTrack(0);
                }
                return;
            }

            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸' : '▶';

            if (isPlaying) {
                playerFrame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&theme=0&autoplay=1`;
                startEqualizer();
            } else {
                playerFrame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&theme=0&autoplay=0`;
                stopEqualizer();
            }
        });

        // ===== ГРОМКОСТЬ =====
        volumeSlider.addEventListener('input', function() {
            const val = this.value;
            volumeValue.textContent = val + '%';
            // Реальная громкость контролируется через iframe, но мы сохраняем значение
            try {
                const iframe = document.querySelector('#playerFrame');
                // Для Spotify Embed громкость контролируется через настройки плеера
                // Мы просто показываем значение
            } catch(e) {}
        });

        // =============================================
        // 7. ЗАПУСК
        // =============================================
        console.log('🩸 SWAG с эквалайзером!');
        console.log('🎵 Войди через Spotify и ищи музыку');
    </script>
