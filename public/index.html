<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #fff;
            padding: 0 20px 100px 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 10;
        }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 4px; color: #fff; font-family: 'Impact', sans-serif; }
        .logo span { color: #cc0000; }
        .status-text { font-size: 13px; color: #666; font-weight: 400; }

        .search-section {
            margin: 24px 0 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-section input {
            flex: 1;
            min-width: 200px;
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }
        .search-section input::placeholder { color: #666; }
        .search-section input:focus { background: rgba(255,255,255,0.1); }
        .search-section button {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 40px;
            padding: 14px 28px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .search-section button:hover { background: rgba(255,255,255,0.12); }

        .section-title { font-size: 22px; font-weight: 700; margin: 28px 0 16px 0; color: #fff; }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .result-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 16px 16px 12px 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .result-card:hover { background: rgba(255,255,255,0.07); }
        .result-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 6px;
            background: #1a1a1a;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }
        .result-card .cover img { width: 100%; height: 100%; object-fit: cover; }
        .result-card .cover .empty-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 48px;
            color: #333;
        }
        .result-card .cover .play-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #000;
            opacity: 0;
            transform: translateY(8px);
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .result-card:hover .cover .play-overlay { opacity: 1; transform: translateY(0); }
        .result-card .title { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-card .artist { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .player-wrapper {
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0,0,0,0.5);
            display: none;
            margin-top: 16px;
        }
        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 80px;
            border: none;
        }

        .loading { color: #666; padding: 40px 0; font-size: 14px; text-align: center; }
        .empty-state { color: #666; padding: 20px 0; font-size: 14px; text-align: center; }

        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .logo { font-size: 22px; }
            .results { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
            .search-section { flex-wrap: wrap; }
            .search-section input { min-width: 100px; }
            .search-section button { padding: 14px 16px; font-size: 13px; }
        }
        @media (max-width: 400px) {
            .results { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span>SWAG</span></div>
        <span class="status-text" id="status">🎵 Введи трек</span>
    </div>

    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Что будем слушать?" value="The Weeknd Starboy">
        <button id="searchBtn">Найти</button>
    </div>

    <div class="section-title">Результаты</div>
    <div id="resultsContainer">
        <div class="empty-state">Напиши название и нажми "Найти"</div>
    </div>

    <div class="player-wrapper" id="playerWrapper">
        <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');

        let currentPlaylist = [];

        // =============================================
        // ПОИСК НА YOUTUBE (бесплатно, без токенов)
        // =============================================
        async function searchMusic() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = `<div class="empty-state">Напиши название трека</div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="loading">⏳ Ищем "${query}"...</div>`;

            try {
                // Используем публичный Invidious API (без ключей)
                const response = await fetch(
                    `https://invidious.jing.ro/api/v1/search?q=${encodeURIComponent(query + ' official audio')}&type=video&hl=en`
                );

                if (!response.ok) throw new Error('Ошибка поиска');

                const data = await response.json();

                if (data && data.length > 0) {
                    currentPlaylist = data;
                    renderResults(data);
                } else {
                    resultsContainer.innerHTML = `<div class="empty-state">😢 Ничего не найдено. Попробуй другое название.</div>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                // Резервный сервер
                try {
                    const response2 = await fetch(
                        `https://invidious.snopyta.org/api/v1/search?q=${encodeURIComponent(query + ' official audio')}&type=video&hl=en`
                    );
                    if (response2.ok) {
                        const data2 = await response2.json();
                        if (data2 && data2.length > 0) {
                            currentPlaylist = data2;
                            renderResults(data2);
                            return;
                        }
                    }
                } catch (e2) {
                    console.error('Резервный поиск не работает:', e2);
                }
                // Демо-режим
                showDemoResults(query);
            }
        }

        // =============================================
        // ДЕМО-РЕЖИМ (если API не работает)
        // =============================================
        function showDemoResults(query) {
            const demos = [
                { title: query || 'Believer', author: 'Imagine Dragons', videoId: '7wtfhZwyrcc' },
                { title: 'Shape of You', author: 'Ed Sheeran', videoId: 'JGwWNGJdvx8' },
                { title: 'Blinding Lights', author: 'The Weeknd', videoId: 'fHI8X4OXluQ' },
                { title: 'Starboy', author: 'The Weeknd', videoId: '34Na4j8JIs' },
                { title: 'Bad Guy', author: 'Billie Eilish', videoId: 'D71lFSY9A' },
                { title: 'Lucid Dreams', author: 'Juice WRLD', videoId: 'mzB1VGEGcSU' }
            ];

            resultsContainer.innerHTML = `
                <div style="text-align:center;color:#666;font-size:13px;padding:10px;font-family:'Segoe UI',sans-serif;">
                    ⚠️ Демо-режим (YouTube API временно недоступен)
                </div>
            `;
            renderResults(demos);
        }

        // =============================================
        // ОТРИСОВКА КАРТОЧЕК
        // =============================================
        function renderResults(videos) {
            let html = '<div class="results">';
            const items = videos.slice(0, 8);

            items.forEach((video) => {
                const title = video.title || 'Без названия';
                const author = video.author || 'Неизвестен';
                const videoId = video.videoId || video.id;

                let cover = '';
                if (video.videoThumbnails && video.videoThumbnails.length > 0) {
                    const thumbs = video.videoThumbnails;
                    cover = thumbs[Math.floor(thumbs.length / 2)]?.url || thumbs[0]?.url || '';
                }
                if (!cover && video.thumbnail) {
                    cover = video.thumbnail;
                }

                html += `
                    <div class="result-card" onclick="playTrack('${videoId}')">
                        <div class="cover">
                            ${cover ? `<img src="${cover}" alt="${title}">` : `<div class="empty-cover">🎵</div>`}
                            <div class="play-overlay">▶</div>
                        </div>
                        <div class="title">${title}</div>
                        <div class="artist">${author}</div>
                    </div>
                `;
            });

            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // =============================================
        // ПЛЕЕР
        // =============================================
        function playTrack(videoId) {
            if (!videoId) {
                alert('Трек не найден');
                return;
            }

            playerFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0&modestbranding=1`;
            playerWrapper.style.display = 'block';
            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // =============================================
        // ОБРАБОТЧИКИ
        // =============================================
        searchBtn.addEventListener('click', searchMusic);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchMusic();
        });

        // Автопоиск при загрузке
        setTimeout(searchMusic, 500);

        console.log('🩸 SWAG (YouTube) ЗАГРУЖЕН!');
        console.log('🎵 Ищем через YouTube (бесплатно!)');
    </script>

</body>
</html>
