<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial Black', sans-serif;
            background: #0a0000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b0000 0%, #0a0000 70%);
        }
        .app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }
        .blood-title {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 15px;
            color: #8b0000;
            text-shadow: 0 0 20px rgba(139,0,0,0.8), 0 0 60px rgba(200,0,0,0.4);
            font-family: 'Impact', sans-serif;
        }
        .blood-sub {
            font-size: 18px;
            color: #661111;
            letter-spacing: 8px;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
        }
        .login-btn {
            background: linear-gradient(135deg, #1db954, #1ed760);
            border: none;
            padding: 16px 48px;
            border-radius: 60px;
            font-weight: 900;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            transition: 0.3s;
        }
        .login-btn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(29,185,84,0.5); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: Arial, sans-serif;
            background: rgba(29,185,84,0.2);
            border: 1px solid #1db954;
            color: #1db954;
            display: inline-block;
        }
        .status.error {
            background: rgba(255,0,0,0.2);
            border-color: #ff0000;
            color: #ff0000;
        }
        .search-section {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-section input {
            flex: 1;
            min-width: 250px;
            background: rgba(20,0,0,0.85);
            border: 2px solid #8b0000;
            border-radius: 40px;
            padding: 14px 20px;
            color: #fff;
            font-size: 16px;
            outline: none;
            font-family: Arial, sans-serif;
        }
        .search-section input:focus { border-color: #ff0000; }
        .search-section button {
            background: linear-gradient(135deg, #8b0000, #cc0000);
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Arial Black', sans-serif;
            transition: 0.3s;
        }
        .search-section button:hover { transform: scale(1.05); }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
            width: 100%;
        }
        .result-card {
            background: rgba(20,0,0,0.7);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #2a0a0a;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .result-card:hover { border-color: #cc0000; transform: translateY(-4px); }
        .result-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            background: #1a0a0a;
            overflow: hidden;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .result-card .cover img { width: 100%; height: 100%; object-fit: cover; }
        .result-card .title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-card .artist { font-size: 12px; color: #883333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loading { color: #883333; font-family: Arial, sans-serif; padding: 40px 0; }
        .no-results { color: #883333; font-family: Arial, sans-serif; padding: 40px 0; font-size: 18px; }
        .player-wrapper {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #2a0a0a;
            background: #0a0000;
            display: none;
        }
        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 352px;
            border: none;
        }
        @media (max-width: 768px) {
            .blood-title { font-size: 44px; letter-spacing: 4px; }
            .player-wrapper iframe { height: 200px; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="app">
        <div class="blood-title">SWAG</div>
        <div class="blood-sub">• только для своих</div>

        <button class="login-btn" id="loginBtn">🔑 Войти через Spotify</button>
        <div class="status" id="status">⏳ Нажми на кнопку выше</div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🎵 Напиши название трека..." value="The Weeknd Starboy">
            <button id="searchBtn">🔍 Искать</button>
        </div>

        <div id="results"><div class="loading">⏳ Войди в Spotify и ищи музыку</div></div>

        <div class="player-wrapper" id="playerWrapper">
            <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 300; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 0.5,
                speed: Math.random() * 0.3 + 0.05,
                brightness: Math.random() * 0.8 + 0.2
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height, 0, canvas.width/2, canvas.height, canvas.width*0.8);
            gradient.addColorStop(0, '#1a0505');
            gradient.addColorStop(1, '#050000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
                const flicker = Math.sin(Date.now() / 1000 * (1 + star.speed * 3)) * 0.3 + 0.7;
                const alpha = star.brightness * flicker;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 200, ${alpha})`;
                if (star.radius > 1.8) { ctx.shadowColor = 'rgba(255,100,100,0.3)'; ctx.shadowBlur = 15; }
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // SPOTIFY
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('results');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');

        let accessToken = null;

        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('access_token');

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;
            localStorage.setItem('spotify_token', accessToken);
            window.history.replaceState({}, document.title, '/');
            showStatus('✅ Авторизован!', '');
            loadUserPlaylists();
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                accessToken = savedToken;
                showStatus('✅ Авторизован (из кеша)', '');
                loadUserPlaylists();
            }
        }

        function showStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status';
            if (type === 'error') statusEl.classList.add('error');
            if (text.includes('Авторизован')) {
                loginBtn.disabled = true;
                loginBtn.textContent = '✅ Вход выполнен';
            }
        }

        loginBtn.addEventListener('click', function() {
            window.location.href = '/login';
        });

        async function loadUserPlaylists() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                if (data.error) {
                    if (data.error.status === 401) {
                        showStatus('❌ Токен протух, войди заново', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🔑 Войти через Spotify';
                        return;
                    }
                    showStatus('❌ Ошибка загрузки', 'error');
                    return;
                }
                if (data.items && data.items.length > 0) {
                    const firstPlaylist = data.items[0];
                    const tracksRes = await fetch(`https://api.spotify.com/v1/playlists/${firstPlaylist.id}/tracks`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const tracksData = await tracksRes.json();
                    renderTracks(tracksData.items);
                    showStatus(`✅ Загружено ${tracksData.items.length} треков`, '');
                } else {
                    showStatus('ℹ️ Нет плейлистов, используй поиск', '');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus('❌ Ошибка загрузки', 'error');
            }
        }

        function renderTracks(tracks) {
            if (!tracks || tracks.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">😢 Нет треков</div>';
                return;
            }
            let html = '<div class="results">';
            tracks.slice(0, 8).forEach(item => {
                const track = item.track;
                if (!track) return;
                const cover = track.album?.images?.[0]?.url || '';
                const coverHtml = cover ? `<img src="${cover}">` : '🎵';
                html += `
                    <div class="result-card" onclick="playTrack('${track.id}')">
                        <div class="cover">${coverHtml}</div>
                        <div class="title">${track.name}</div>
                        <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                    </div>
                `;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        searchBtn.addEventListener('click', async function() {
            const query = searchInput.value.trim();
            if (!query) { alert('Напиши название трека!'); return; }
            if (!accessToken) { alert('Сначала авторизуйся через Spotify!'); return; }
            resultsContainer.innerHTML = '<div class="loading">⏳ Ищем...</div>';
            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                    let html = '<div class="results">';
                    data.tracks.items.forEach(track => {
                        const cover = track.album?.images?.[0]?.url || '';
                        const coverHtml = cover ? `<img src="${cover}">` : '🎵';
                        html += `
                            <div class="result-card" onclick="playTrack('${track.id}')">
                                <div class="cover">${coverHtml}</div>
                                <div class="title">${track.name}</div>
                                <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    resultsContainer.innerHTML = html;
                } else {
                    resultsContainer.innerHTML = '<div class="no-results">😢 Ничего не найдено</div>';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultsContainer.innerHTML = '<div class="no-results">❌ Ошибка поиска</div>';
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchBtn.click();
        });

        function playTrack(trackId) {
            if (!trackId) { alert('Трек не найден'); return; }
            playerFrame.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0&autoplay=1`;
            playerWrapper.style.display = 'block';
            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        console.log('🩸 SWAG на Spotify!');
    </script>

</body>
</html>
