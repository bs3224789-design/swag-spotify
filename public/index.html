<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #fff;
            padding: 0 20px 100px 20px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            font-family: 'Impact', sans-serif;
            text-decoration: none;
        }

        .logo span {
            color: #cc0000;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .login-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .login-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .login-btn.green {
            background: #1db954;
            color: #000;
        }

        .login-btn.green:hover {
            background: #1ed760;
        }

        .status-text {
            font-size: 13px;
            color: #666;
            font-weight: 400;
        }

        .status-text.success {
            color: #1db954;
        }

        .status-text.error {
            color: #cc0000;
        }

        /* ===== ПОИСК ===== */
        .search-section {
            margin: 24px 0 20px 0;
        }

        .search-section input {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }

        .search-section input::placeholder {
            color: #666;
        }

        .search-section input:focus {
            background: rgba(255, 255, 255, 0.1);
        }

        .search-section button {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            margin-left: -44px;
            vertical-align: middle;
        }

        /* ===== ЗАГОЛОВОК РАЗДЕЛА ===== */
        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 28px 0 16px 0;
            color: #fff;
            letter-spacing: -0.3px;
        }

        /* ===== СЕТКА ТРЕКОВ (КАК В SPOTIFY) ===== */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 16px 16px 12px 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            border: none;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .result-card .cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 6px;
            background: #1a1a1a;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }

        .result-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-card .cover .empty-cover {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 48px;
            color: #333;
        }

        /* Кнопка Play поверх обложки (как в Spotify) */
        .result-card .cover .play-overlay {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #000;
            opacity: 0;
            transform: translateY(8px);
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .result-card:hover .cover .play-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .result-card .title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-card .artist {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* ===== ПАНЕЛЬ "СЕЙЧАС ИГРАЕТ" (КАК В SPOTIFY) ===== */
        #nowPlaying {
            display: none;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            margin: 20px 0 12px 0;
            text-align: left;
        }

        #nowPlaying .np-cover {
            width: 56px;
            height: 56px;
            border-radius: 6px;
            background: #1a1a1a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #nowPlaying .np-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #nowPlaying .np-info {
            flex: 1;
            overflow: hidden;
        }

        #nowPlaying .np-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #nowPlaying .np-artist {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== КОНТРОЛЫ (КАК В SPOTIFY) ===== */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 12px 0 8px 0;
        }

        .player-controls button {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .player-controls button:hover {
            color: #fff;
        }

        .player-controls .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            color: #000;
            font-size: 20px;
        }

        .player-controls .play-btn:hover {
            background: #1ed760;
            color: #000;
        }

        .player-controls .play-btn.paused {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .player-controls .play-btn.paused:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== ГРОМКОСТЬ ===== */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }

        .volume-section .vol-icon {
            font-size: 16px;
            color: #666;
        }

        .volume-section input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            transition: 0.3s;
        }

        .volume-section input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        .volume-section input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        .volume-section .vol-value {
            font-size: 13px;
            color: #666;
            min-width: 36px;
            text-align: right;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ===== ПЛЕЕР (iframe) ===== */
        .player-wrapper {
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            margin-top: 8px;
        }

        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 80px;
            border: none;
        }

        /* ===== СОСТОЯНИЯ ===== */
        .loading {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
            font-size: 14px;
            text-align: center;
        }

        .no-results {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
            font-size: 14px;
            text-align: center;
        }

        .empty-state {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px 0;
            font-size: 14px;
            text-align: center;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 0;
            }
            .header-right {
                width: 100%;
                justify-content: space-between;
            }
            .login-btn {
                font-size: 13px;
                padding: 8px 16px;
            }
            .logo {
                font-size: 22px;
            }
            .results {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .result-card .cover .play-overlay {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .player-controls button {
                font-size: 18px;
            }
            .player-controls .play-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .volume-section input[type="range"] {
                width: 80px;
            }
            .section-title {
                font-size: 18px;
            }
            #nowPlaying .np-cover {
                width: 44px;
                height: 44px;
            }
            #nowPlaying .np-title {
                font-size: 14px;
            }
            #nowPlaying .np-artist {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .results {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo"><span>SWAG</span></div>
        <div class="header-right">
            <span class="status-text" id="status">Войди в Spotify</span>
            <button class="login-btn" id="loginBtn">Войти</button>
        </div>
    </div>

    <!-- ===== ПОИСК ===== -->
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Что будем слушать?" value="The Weeknd Starboy">
        <button id="searchBtn">🔍</button>
    </div>

    <!-- ===== СЕЙЧАС ИГРАЕТ ===== -->
    <div id="nowPlaying">
        <div class="np-cover" id="npCover">🎵</div>
        <div class="np-info">
            <div class="np-title" id="npTitle">Выбери трек</div>
            <div class="np-artist" id="npArtist">—</div>
        </div>
    </div>

    <!-- ===== КОНТРОЛЫ ===== -->
    <div id="playerControls" style="display:none;">
        <div class="player-controls">
            <button id="prevBtn" title="Назад">⏮</button>
            <button class="play-btn" id="playBtn" title="Play">▶</button>
            <button id="nextBtn" title="Вперёд">⏭</button>
        </div>
        <div class="volume-section">
            <span class="vol-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
            <span class="vol-value" id="volumeValue">80%</span>
        </div>
    </div>

    <!-- ===== РЕЗУЛЬТАТЫ ===== -->
    <div class="section-title">Популярное</div>
    <div id="resultsContainer">
        <div class="empty-state">Войди в Spotify и ищи музыку</div>
    </div>

    <!-- ===== ПЛЕЕР ===== -->
    <div class="player-wrapper" id="playerWrapper">
        <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        // =============================================
        // SPOTIFY
        // =============================================
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');
        const nowPlaying = document.getElementById('nowPlaying');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npArtist = document.getElementById('npArtist');
        const playerControls = document.getElementById('playerControls');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');

        let accessToken = null;
        let currentTrackId = null;
        let playlist = [];
        let currentIndex = -1;
        let isPlaying = false;

        // ===== ТОКЕН =====
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('access_token');

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;
            localStorage.setItem('spotify_token', accessToken);
            window.history.replaceState({}, document.title, '/');
            updateUI('✅ Авторизован', 'success');
            loadUserPlaylists();
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                accessToken = savedToken;
                updateUI('✅ Авторизован', 'success');
                loadUserPlaylists();
            }
        }

        function updateUI(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status-text';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
            if (text.includes('Авторизован')) {
                loginBtn.disabled = true;
                loginBtn.textContent = '✅ Вход';
                loginBtn.classList.add('green');
            } else {
                loginBtn.textContent = 'Войти';
                loginBtn.classList.remove('green');
            }
        }

        loginBtn.addEventListener('click', function() {
            window.location.href = '/login';
        });

        // =============================================
        // ЗАГРУЗКА ПЛЕЙЛИСТОВ
        // =============================================
        async function loadUserPlaylists() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.error) {
                    if (data.error.status === 401) {
                        updateUI('❌ Токен протух', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Войти';
                        loginBtn.classList.remove('green');
                        return;
                    }
                    updateUI('❌ Ошибка', 'error');
                    return;
                }

                if (data.items && data.items.length > 0) {
                    const firstPlaylist = data.items[0];
                    const tracksRes = await fetch(`https://api.spotify.com/v1/playlists/${firstPlaylist.id}/tracks`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const tracksData = await tracksRes.json();
                    const tracks = tracksData.items.map(item => item.track).filter(t => t);
                    playlist = tracks;
                    renderTracks(tracks);
                    updateUI(`✅ ${tracks.length} треков`, 'success');
                } else {
                    updateUI('ℹ️ Нет плейлистов', '');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                updateUI('❌ Ошибка', 'error');
            }
        }

        // =============================================
        // ОТРИСОВКА ТРЕКОВ
        // =============================================
        function renderTracks(tracks) {
            if (!tracks || tracks.length === 0) {
                resultsContainer.innerHTML = `<div class="empty-state">😢 Нет треков</div>`;
                return;
            }

            let html = '<div class="results">';
            tracks.slice(0, 12).forEach((track, index) => {
                const cover = track.album?.images?.[0]?.url || '';
                const coverHtml = cover ? `<img src="${cover}">` : '<div class="empty-cover">🎵</div>';

                html += `
                    <div class="result-card" onclick="playTrack(${index})" data-index="${index}">
                        <div class="cover">
                            ${coverHtml}
                            <div class="play-overlay">▶</div>
                        </div>
                        <div class="title">${track.name}</div>
                        <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                    </div>
                `;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // =============================================
        // ПОИСК
        // =============================================
        searchBtn.addEventListener('click', async function() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = `<div class="empty-state">Напиши название</div>`;
                return;
            }
            if (!accessToken) {
                resultsContainer.innerHTML = `<div class="empty-state">Сначала войди в Spotify</div>`;
                return;
            }

            resultsContainer.innerHTML = `<div class="loading">⏳ Ищем...</div>`;

            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=12`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                    playlist = data.tracks.items;
                    renderTracks(playlist);
                } else {
                    resultsContainer.innerHTML = `<div class="empty-state">😢 Ничего не найдено</div>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultsContainer.innerHTML = `<div class="empty-state">❌ Ошибка</div>`;
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchBtn.click();
        });

        // =============================================
        // ПЛЕЕР
        // =============================================
        function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];
            if (!track) return;

            currentTrackId = track.id;
            isPlaying = true;

            // Обновляем "Сейчас играет"
            const cover = track.album?.images?.[0]?.url || '';
            npCover.innerHTML = cover ? `<img src="${cover}">` : '🎵';
            npTitle.textContent = track.name;
            npArtist.textContent = track.artists.map(a => a.name).join(', ');
            nowPlaying.style.display = 'flex';
            playerControls.style.display = 'block';

            // Плеер
            playerFrame.src = `https://open.spotify.com/embed/track/${track.id}?utm_source=generator&theme=0&autoplay=1`;
            playerWrapper.style.display = 'block';
            playBtn.textContent = '⏸';
            playBtn.classList.remove('paused');

            // Подсветка
            document.querySelectorAll('.result-card').forEach((el, i) => {
                el.style.background = i === index ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
            });

            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ =====
        prevBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            const newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(newIndex);
        });

        nextBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            const newIndex = (currentIndex + 1) % playlist.length;
            playTrack(newIndex);
        });

        // ===== PLAY/PAUSE =====
        playBtn.addEventListener('click', function() {
            if (!currentTrackId) {
                if (playlist.length > 0) {
                    playTrack(0);
                }
                return;
            }

            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸' : '▶';
            this.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                playerFrame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&theme=0&autoplay=1`;
            } else {
                playerFrame.src = `https://open.spotify.com/embed/track/${currentTrackId}?utm_source=generator&theme=0&autoplay=0`;
            }
        });

        // ===== ГРОМКОСТЬ =====
        volumeSlider.addEventListener('input', function() {
            volumeValue.textContent = this.value + '%';
        });

        // =============================================
        // ЗАПУСК
        // =============================================
        console.log('🩸 SWAG — стиль Spotify');
    </script>

</body>
</html>
