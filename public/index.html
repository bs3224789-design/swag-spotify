<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 16px;
        }

        /* ===== ЗВЁЗДЫ ===== */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #0a0000 0%, #050000 70%);
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        /* ===== ЗАГОЛОВОК ===== */
        .blood-title {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #cc0000;
            text-shadow: 0 0 30px rgba(200, 0, 0, 0.4);
            font-family: 'Impact', sans-serif;
            margin-bottom: 4px;
        }

        .blood-sub {
            font-size: 14px;
            color: #883333;
            letter-spacing: 6px;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 24px;
        }

        /* ===== СТЕКЛЯННЫЕ КАРТОЧКИ ===== */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ===== КНОПКА ВХОДА ===== */
        .login-btn {
            background: rgba(29, 185, 84, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 60px;
            padding: 16px 40px;
            color: #1db954;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            width: 100%;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: rgba(29, 185, 84, 0.25);
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.1);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== СТАТУС ===== */
        .status {
            font-size: 14px;
            color: #883333;
            font-family: 'Segoe UI', sans-serif;
            padding: 8px 0;
        }

        .status.success {
            color: #1db954;
        }

        .status.error {
            color: #cc0000;
        }

        /* ===== ПОИСК ===== */
        .search-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-section input {
            flex: 1;
            min-width: 180px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 14px 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            transition: 0.3s;
        }

        .search-section input::placeholder {
            color: #663333;
        }

        .search-section input:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-section button {
            background: rgba(200, 0, 0, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(200, 0, 0, 0.25);
            border-radius: 60px;
            padding: 14px 24px;
            color: #cc6666;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        .search-section button:hover {
            background: rgba(200, 0, 0, 0.25);
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.1);
        }

        /* ===== РЕЗУЛЬТАТЫ ===== */
        .results {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 8px;
            width: 100%;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 18px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .result-card .cover {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #1a0a0a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .result-card .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-card .info {
            flex: 1;
            overflow: hidden;
        }

        .result-card .title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-card .artist {
            font-size: 13px;
            color: #883333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== ПЛЕЕР ===== */
        .player-wrapper {
            border-radius: 16px;
            overflow: hidden;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 352px;
            border: none;
        }

        /* ===== ТЕКСТОВЫЕ СОСТОЯНИЯ ===== */
        .loading {
            color: #663333;
            font-family: 'Segoe UI', sans-serif;
            padding: 24px 0;
            font-size: 15px;
        }

        .no-results {
            color: #663333;
            font-family: 'Segoe UI', sans-serif;
            padding: 24px 0;
            font-size: 15px;
        }

        .empty-state {
            color: #553333;
            font-family: 'Segoe UI', sans-serif;
            padding: 16px 0;
            font-size: 14px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .blood-title { font-size: 44px; letter-spacing: 4px; }
            .app { padding: 0; }
            .glass { padding: 16px; }
            .search-section input { min-width: 120px; }
            .player-wrapper iframe { height: 220px; }
            .result-card .cover { width: 44px; height: 44px; }
            .result-card .title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="app">

        <!-- ЗАГОЛОВОК -->
        <div class="blood-title">SWAG</div>
        <div class="blood-sub">• только для своих</div>

        <!-- КНОПКА ВХОДА + СТАТУС -->
        <div class="glass">
            <button class="login-btn" id="loginBtn">🔑 Войти через Spotify</button>
            <div class="status" id="status">Нажми на кнопку выше</div>
        </div>

        <!-- ПОИСК -->
        <div class="glass">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Поиск треков..." value="The Weeknd Starboy">
                <button id="searchBtn">Искать</button>
            </div>
        </div>

        <!-- РЕЗУЛЬТАТЫ -->
        <div id="resultsContainer">
            <div class="glass">
                <div class="empty-state">Войди в Spotify и ищи музыку</div>
            </div>
        </div>

        <!-- ПЛЕЕР -->
        <div class="player-wrapper" id="playerWrapper">
            <iframe id="playerFrame" src="" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>

    </div>

    <script>
        // =============================================
        // 1. ЗВЁЗДЫ
        // =============================================
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.2 + 0.03,
                brightness: Math.random() * 0.7 + 0.3,
                phase: Math.random() * Math.PI * 2
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height, 0, canvas.width/2, canvas.height, canvas.width*0.8);
            gradient.addColorStop(0, '#120000');
            gradient.addColorStop(1, '#050000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() / 1000;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
                const flicker = Math.sin(time * (1 + star.speed * 5) + star.phase) * 0.3 + 0.7;
                const alpha = star.brightness * flicker;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 200, ${alpha * 0.6})`;
                if (star.radius > 1.5) {
                    ctx.shadowColor = 'rgba(255,100,100,0.15)';
                    ctx.shadowBlur = 12;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // =============================================
        // 2. SPOTIFY
        // =============================================
        const loginBtn = document.getElementById('loginBtn');
        const statusEl = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerFrame = document.getElementById('playerFrame');

        let accessToken = null;

        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('access_token');

        if (tokenFromUrl) {
            accessToken = tokenFromUrl;
            localStorage.setItem('spotify_token', accessToken);
            window.history.replaceState({}, document.title, '/');
            showStatus('✅ Авторизован', 'success');
            loadUserPlaylists();
        } else {
            const savedToken = localStorage.getItem('spotify_token');
            if (savedToken) {
                accessToken = savedToken;
                showStatus('✅ Авторизован', 'success');
                loadUserPlaylists();
            }
        }

        function showStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status';
            if (type === 'success') statusEl.classList.add('success');
            if (type === 'error') statusEl.classList.add('error');
            if (text.includes('Авторизован')) {
                loginBtn.disabled = true;
                loginBtn.textContent = '✅ Вход выполнен';
            }
        }

        loginBtn.addEventListener('click', function() {
            window.location.href = '/login';
        });

        // =============================================
        // 3. ЗАГРУЗКА ПЛЕЙЛИСТОВ
        // =============================================
        async function loadUserPlaylists() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me/playlists', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.error) {
                    if (data.error.status === 401) {
                        showStatus('❌ Токен протух, войди заново', 'error');
                        localStorage.removeItem('spotify_token');
                        loginBtn.disabled = false;
                        loginBtn.textContent = '🔑 Войти через Spotify';
                        return;
                    }
                    showStatus('❌ Ошибка загрузки', 'error');
                    return;
                }

                if (data.items && data.items.length > 0) {
                    const firstPlaylist = data.items[0];
                    const tracksRes = await fetch(`https://api.spotify.com/v1/playlists/${firstPlaylist.id}/tracks`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const tracksData = await tracksRes.json();
                    renderTracks(tracksData.items);
                    showStatus(`✅ Загружено ${tracksData.items.length} треков`, 'success');
                } else {
                    showStatus('ℹ️ Нет плейлистов, используй поиск', '');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus('❌ Ошибка загрузки', 'error');
            }
        }

        // =============================================
        // 4. ОТРИСОВКА ТРЕКОВ
        // =============================================
        function renderTracks(tracks) {
            if (!tracks || tracks.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="glass">
                        <div class="empty-state">😢 Нет треков</div>
                    </div>
                `;
                return;
            }

            let html = '<div class="results">';
            tracks.slice(0, 10).forEach(item => {
                const track = item.track;
                if (!track) return;
                const cover = track.album?.images?.[0]?.url || '';
                const coverHtml = cover ? `<img src="${cover}">` : '🎵';
                html += `
                    <div class="result-card" onclick="playTrack('${track.id}')">
                        <div class="cover">${coverHtml}</div>
                        <div class="info">
                            <div class="title">${track.name}</div>
                            <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        // =============================================
        // 5. ПОИСК
        // =============================================
        searchBtn.addEventListener('click', async function() {
            const query = searchInput.value.trim();
            if (!query) { 
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">Напиши название трека</div></div>`;
                return; 
            }
            if (!accessToken) { 
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">Сначала войди в Spotify</div></div>`;
                return; 
            }

            resultsContainer.innerHTML = `<div class="glass"><div class="loading">⏳ Ищем...</div></div>`;

            try {
                const response = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=10`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();

                if (data.tracks && data.tracks.items && data.tracks.items.length > 0) {
                    let html = '<div class="results">';
                    data.tracks.items.forEach(track => {
                        const cover = track.album?.images?.[0]?.url || '';
                        const coverHtml = cover ? `<img src="${cover}">` : '🎵';
                        html += `
                            <div class="result-card" onclick="playTrack('${track.id}')">
                                <div class="cover">${coverHtml}</div>
                                <div class="info">
                                    <div class="title">${track.name}</div>
                                    <div class="artist">${track.artists.map(a => a.name).join(', ')}</div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    resultsContainer.innerHTML = html;
                } else {
                    resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">😢 Ничего не найдено</div></div>`;
                }
            } catch (error) {
                console.error('Ошибка:', error);
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">❌ Ошибка поиска</div></div>`;
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchBtn.click();
        });

        // =============================================
        // 6. ПЛЕЕР
        // =============================================
        function playTrack(trackId) {
            if (!trackId) { 
                resultsContainer.innerHTML = `<div class="glass"><div class="empty-state">❌ Трек не найден</div></div>`;
                return; 
            }
            playerFrame.src = `https://open.spotify.com/embed/track/${trackId}?utm_source=generator&theme=0&autoplay=1`;
            playerWrapper.style.display = 'block';
            playerWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        console.log('🩸 SWAG — стеклянный дизайн!');
    </script>

</body>
</html>
